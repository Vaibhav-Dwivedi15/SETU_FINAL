[pytest]
# Aug 21 2026: restricts test discovery to the real tests/ directory
# only. WHY THIS EXISTS: several debug_*.py scripts sit at the repo
# root (debug_sms_test.py, debug_load_test.py, debug_test1-5.py,
# send_test_packet.py) -- useful for Ayush's own manual local testing
# against a real running Postgres, but debug_sms_test.py specifically
# matches pytest's default test-file discovery pattern (*_test.py),
# so pytest was collecting it as a real test and trying to run it.
# That script connects to a real local Postgres at localhost:5432
# (not the in-memory SQLite the actual test suite uses via
# tests/conftest.py), so it fails immediately with a connection
# refused error on any machine without a local Postgres running --
# which crashed the ENTIRE test run at collection time, before any
# real test even executed. This does not delete or move the debug
# scripts (they may still be genuinely useful for manual local
# testing against a real DB) -- it just tells pytest where the real,
# CI-safe test suite actually lives.
testpaths = tests
