# SETU CI (Block 3 security review).
#
# STATUS, stated plainly: this workflow has been reviewed and its individual commands were run
# locally (see docs/security/BLOCK3_FINAL_SECURITY_VALIDATION.md), but it has NEVER been executed on a
# GitHub runner from this environment. Nothing here is claimed as CI-verified.
#
# Security posture:
#  * least privilege: read-only GITHUB_TOKEN for every job; no job needs secrets;
#  * every third-party action is pinned to a full commit SHA (tag in the trailing comment);
#    Dependabot (.github/dependabot.yml) proposes updates;
#  * checkout never persists the token; nothing is uploaded as an artifact, nothing prints env;
#  * a release build with no signing material is asserted to FAIL (no debug-key fallback).
name: SETU CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-security-guard:
    name: Repository security guard (secrets, signing, manifest, dashboard bundle rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Run guard
        run: python3 tools/security/repo_guard.py

  flutter-analyze-and-test:
    name: Flutter analyze + test (setu_app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # TODO(release owner): pin `flutter-version` to the project's verified version (local runs used
      # Flutter 3.44.8 stable); 'stable' is a moving target.
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: setu_app
        run: flutter pub get
      - name: flutter analyze
        working-directory: setu_app
        run: flutter analyze
      - name: flutter test
        working-directory: setu_app
        run: flutter test

  backend-and-dashboard-tests:
    name: Backend pytest + pip-audit, dashboard tests/build/audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install backend dependencies (test subset; whisper/sentence-transformers excluded)
        working-directory: Backend
        run: |
          grep -v -e '^#' -e '^$' -e 'openai-whisper' -e 'sentence-transformers' requirements.txt > "$RUNNER_TEMP/req.txt"
          pip install -r "$RUNNER_TEMP/req.txt" numpy pip-audit
      - name: Backend tests
        working-directory: Backend
        run: python -m pytest -q
      - name: AI service tests
        working-directory: Backend/setu_ai_service
        run: python -m pytest -q
      - name: Python dependency audit (pinned requirements)
        working-directory: Backend
        run: |
          grep -v -e '^#' -e '^$' -e 'openai-whisper' -e 'sentence-transformers' -e '^numpy' -e 'email-validator' -e 'python-multipart' requirements.txt > "$RUNNER_TEMP/pinned.txt"
          pip-audit -r "$RUNNER_TEMP/pinned.txt" --no-deps --disable-pip --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Dashboard install
        working-directory: setu_dashboard
        run: npm ci
      - name: Dashboard tests (secret-in-bundle canary, demo elimination, session, headers, contract)
        working-directory: setu_dashboard
        run: npm test
      - name: Dashboard build
        working-directory: setu_dashboard
        env:
          VITE_BACKEND_URL: https://setu-backend-cy78.onrender.com
        run: npm run build
      - name: Dashboard dependency audit (production dependencies, fail on high+)
        working-directory: setu_dashboard
        run: npm audit --omit=dev --audit-level=high

  cross-language-signature-gate:
    name: Cross-language signature gate (Dart -> Python -> Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install backend dependencies (signature service needs cryptography)
        working-directory: Backend
        run: pip install cryptography
      - name: flutter pub get
        working-directory: setu_app
        run: flutter pub get
      - name: Run the gate
        run: tools/cross_lang/run_gate.sh

  native-unit-tests:
    name: Native Kotlin unit tests (setu_app/android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: setu_app
        run: flutter pub get
      - name: Run native unit tests
        working-directory: setu_app/android
        # Scoped to :app: the third-party geolocator_android plugin's own tests fail here (Mockito/JDK).
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  build-debug-apk:
    name: Build debug APK + assert release signing has no debug fallback
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [flutter-analyze-and-test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: flutter pub get
        working-directory: setu_app
        run: flutter pub get
      - name: flutter build apk --debug
        working-directory: setu_app
        run: flutter build apk --debug
      - name: Release build WITHOUT signing material must be refused
        working-directory: setu_app
        run: |
          if flutter build apk --release > "$RUNNER_TEMP/release.log" 2>&1; then
            echo "::error::release build succeeded without signing material (debug-key fallback?)"; exit 1
          fi
          grep -q "SETU RELEASE BUILD REFUSED" "$RUNNER_TEMP/release.log"
