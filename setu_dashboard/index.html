<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Block 3: the Content-Security-Policy (and every other security header) is a real HTTP
      response header defined in vercel.json -- NOT a <meta> tag. The same header set is applied
      to `vite preview` (vite.config.js) so it can be tested against the real build
      (tests/headers.test.mjs). If VITE_BACKEND_URL points anywhere other than the origin in
      vercel.json's connect-src, update that value or the browser will block API calls.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>SETU — Emergency Response Dashboard</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
